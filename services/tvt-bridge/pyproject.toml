[project]
name = "wso-tvt-bridge"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cryptography>=50,<51", "grpcio==1.84.0", "protobuf==7.36.2", "wso-contracts", "wso-core"]

[project.optional-dependencies]
worker = ["wso-api"]

[tool.uv.sources]
wso-contracts = { workspace = true }
wso-core = { workspace = true }
wso-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wso_tvt_bridge"]
