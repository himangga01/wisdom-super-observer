[project]
name = "wso-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.35,<1", "wso-contracts", "wso-core"]

[tool.uv.sources]
wso-contracts = { workspace = true }
wso-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wso_api"]
