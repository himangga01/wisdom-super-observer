[project]
name = "wso-tvt-media"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["wso-core", "aiortc==1.15.0", "av>=14,<18"]

[tool.uv.sources]
wso-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wso_tvt_media"]
