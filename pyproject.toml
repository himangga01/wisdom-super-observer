[project]
name = "wso-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["wso-api", "wso-contracts", "wso-core", "wso-tvt-bridge"]

[dependency-groups]
dev = [
  "grpcio-tools==1.84.0",
  "types-protobuf>=7.34,<8",
  "grpc-stubs>=1.53,<2",
  "httpx>=0.28,<1",
  "httpx2>=2,<3",
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[tool.uv.workspace]
members = ["services/tvt-bridge", "services/api", "packages/contracts", "packages/core"]

[tool.uv.sources]
wso-tvt-bridge = { workspace = true }
wso-api = { workspace = true }
wso-contracts = { workspace = true }
wso-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "jobs_recovery: actual Linux Celery/Valkey process recovery acceptance",
  "private_assets: actual Linux private S3 and HTTP lifecycle acceptance",
]

[tool.ruff]
extend-exclude = [
    "services/tvt-bridge/src/wso_tvt_bridge/generated/tvt_bridge_pb2.py",
    "services/tvt-bridge/src/wso_tvt_bridge/generated/tvt_bridge_pb2_grpc.py",
]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["services/tvt-bridge/src","services/api/src", "packages/contracts/src", "packages/core/src"]
