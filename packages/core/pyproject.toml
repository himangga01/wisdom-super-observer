[project]
name = "wso-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3,<4",
  "alembic>=1.16,<2",
  "cryptography>=50,<51",
  "celery[redis]==5.6.3",
  "billiard==4.3.0",
  "boto3==1.43.105",
  "Pillow==12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wso_core"]
