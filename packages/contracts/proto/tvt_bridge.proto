syntax = "proto3";
package wso.tvt.account.v1;

// v1 numbers are permanent. Future removed fields MUST be reserved by number
// and name. 5..15 are reserved for authority fields that must remain in SQL.
message RpcContext {
  uint32 protocol_version = 1;
  string ticket = 2;
  uint32 deadline_ms = 3;
  string correlation_id = 4;
  reserved 5 to 15;
  reserved "tenant_id", "actor_id", "kind", "generation", "authority";
}
message LoginRequest { RpcContext context = 1; bytes account_login_json = 2; }
message ImageChallengeRequest { RpcContext context = 1; }
message CheckImageRequest { RpcContext context = 1; bytes image_check_json = 2; }
message ProfileRequest { RpcContext context = 1; }
message RenewRequest { RpcContext context = 1; bytes account_refresh_json = 2; }
message LogoutRequest { RpcContext context = 1; }
// Only the exact method's public Pydantic output is carried here.
// Failure is a fixed code from the transport allowlist, never an exception.
message AccountReply { bytes public_json = 1; string failure_code = 2; }
service AccountBridgeV1 {
  rpc Login(LoginRequest) returns (AccountReply);
  rpc ImageChallenge(ImageChallengeRequest) returns (AccountReply);
  rpc CheckImage(CheckImageRequest) returns (AccountReply);
  rpc Profile(ProfileRequest) returns (AccountReply);
  rpc Renew(RenewRequest) returns (AccountReply);
  rpc Logout(LogoutRequest) returns (AccountReply);
}

// Separate fixed registration/recovery surface. Payloads are private closed
// method-specific JSON; context and SQL authority rules remain identical.
message FlowStartRequest { RpcContext context = 1; bytes private_json = 2; }
message FlowStateRequest { RpcContext context = 1; bytes private_json = 2; }
message FlowExistenceRequest { RpcContext context = 1; bytes private_json = 2; }
message FlowImageRequest { RpcContext context = 1; bytes private_json = 2; }
message FlowIssueCodeRequest { RpcContext context = 1; bytes private_json = 2; }
message FlowRegisterRequest { RpcContext context = 1; bytes private_json = 2; }
message FlowRecoverRequest { RpcContext context = 1; bytes private_json = 2; }
message FlowCancelRequest { RpcContext context = 1; bytes private_json = 2; }
message FlowReply { bytes public_json = 1; string failure_code = 2; }
service FlowBridgeV1 {
  rpc Start(FlowStartRequest) returns (FlowReply);
  rpc State(FlowStateRequest) returns (FlowReply);
  rpc Existence(FlowExistenceRequest) returns (FlowReply);
  rpc Image(FlowImageRequest) returns (FlowReply);
  rpc IssueCode(FlowIssueCodeRequest) returns (FlowReply);
  rpc Register(FlowRegisterRequest) returns (FlowReply);
  rpc Recover(FlowRecoverRequest) returns (FlowReply);
  rpc Cancel(FlowCancelRequest) returns (FlowReply);
}

// Private closed selectors, with authority retained in SQL RpcContext reservations.
message DirectoryDeviceListRequest { RpcContext context = 1; bytes query_json = 2; }
message DirectoryChannelListRequest { RpcContext context = 1; bytes query_json = 2; }
message DirectoryDeviceDetailRequest { RpcContext context = 1; bytes query_json = 2; }
message DirectoryChannelDetailRequest { RpcContext context = 1; bytes query_json = 2; }
message DirectorySentSharesRequest { RpcContext context = 1; bytes query_json = 2; }
message DirectoryReceivedSharesRequest { RpcContext context = 1; bytes query_json = 2; }
message DirectoryReply { bytes public_json = 1; string failure_code = 2; }
service DirectoryBridgeV1 {
  rpc DeviceList(DirectoryDeviceListRequest) returns (DirectoryReply);
  rpc ChannelList(DirectoryChannelListRequest) returns (DirectoryReply);
  rpc DeviceDetail(DirectoryDeviceDetailRequest) returns (DirectoryReply);
  rpc ChannelDetail(DirectoryChannelDetailRequest) returns (DirectoryReply);
  rpc SentShares(DirectorySentSharesRequest) returns (DirectoryReply);
  rpc ReceivedShares(DirectoryReceivedSharesRequest) returns (DirectoryReply);
}
